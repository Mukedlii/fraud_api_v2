<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0066ff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#ff8800"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Shield -->
  <path d="M64 18 L90 28 L90 58 Q90 80 64 94 Q38 80 38 58 L38 28 Z"
        fill="url(#shield)" opacity="0.15" filter="url(#glow)"/>
  <path d="M64 18 L90 28 L90 58 Q90 80 64 94 Q38 80 38 58 L38 28 Z"
        fill="none" stroke="url(#shield)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Scan lines -->
  <line x1="44" y1="48" x2="84" y2="48" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <line x1="44" y1="56" x2="84" y2="56" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <line x1="44" y1="64" x2="84" y2="64" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>

  <!-- Scan beam -->
  <rect x="38" y="50" width="52" height="3" rx="1.5"
        fill="url(#scan)" opacity="0.8" filter="url(#glow)"/>

  <!-- Target circle -->
  <circle cx="64" cy="56" r="10" fill="none" stroke="url(#scan)" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
  <circle cx="64" cy="56" r="3" fill="#ff4444" opacity="0.9" filter="url(#glow)"/>

  <!-- Corner scan markers -->
  <path d="M44 42 L44 38 L48 38" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
  <path d="M84 42 L84 38 L80 38" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
  <path d="M44 78 L44 82 L48 82" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
  <path d="M84 78 L84 82 L80 82" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>

  <!-- Bottom text -->
  <text x="64" y="114" font-family="monospace" font-size="8" fill="#00d4ff"
        text-anchor="middle" opacity="0.8" letter-spacing="2">FRAUD.AI</text>
</svg>
